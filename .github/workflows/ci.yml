name: CI → Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

  deploy:
    name: Deploy to Vercel
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Sync runtime env vars to Vercel (PATCH if it exists, POST if not)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_EMAIL: ${{ secrets.NTFY_EMAIL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # SESSION_SECRET seals the interview sessions; the app refuses to run in production without it.
          [ -n "$SESSION_SECRET" ] || { echo "SESSION_SECRET secret is missing"; exit 1; }

          for KEY in GROQ_API_KEY NVIDIA_NIM_API_KEY NVIDIA_MODEL SESSION_SECRET NTFY_TOPIC NTFY_EMAIL NTFY_TOKEN; do
            VALUE="${!KEY}"
            if [ -z "$VALUE" ]; then echo "skip $KEY (not set in GitHub)"; continue; fi

            ENV_ID=$(curl -s \
              "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              | jq -r --arg k "$KEY" '.envs[] | select(.key==$k and (.target // [] | contains(["production"]))) | .id' \
              | head -1)

            # jq builds the JSON so a value with quotes or backslashes cannot break the payload.
            BODY=$(jq -n --arg k "$KEY" --arg v "$VALUE" '{key:$k,value:$v,type:"encrypted",target:["production"]}')

            if [ -n "$ENV_ID" ] && [ "$ENV_ID" != "null" ]; then
              echo "Updating $KEY (id: $ENV_ID)"
              curl -s -X PATCH "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env/$ENV_ID" \
                -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
                -d "$BODY" | jq '{key: .key, target: .target}'
            else
              echo "Creating $KEY"
              curl -s -X POST "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env" \
                -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
                -d "$BODY" | jq '{key: .key, target: .target}'
            fi
          done

      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel --prod --token "$VERCEL_TOKEN" --yes
