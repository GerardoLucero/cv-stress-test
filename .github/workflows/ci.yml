name: CI → Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

  deploy:
    name: Deploy to Vercel
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Upsert GROQ_API_KEY in Vercel (GET id → PATCH or POST)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # Find existing env var ID for GROQ_API_KEY in production
          ENV_ID=$(curl -s \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            | jq -r '.envs[] | select(.key=="GROQ_API_KEY" and (.target // [] | contains(["production"]))) | .id' \
            | head -1)

          if [ -n "$ENV_ID" ] && [ "$ENV_ID" != "null" ]; then
            echo "Updating existing env var (id: $ENV_ID)"
            curl -s -X PATCH \
              "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env/$ENV_ID" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"value\":\"$GROQ_API_KEY\",\"type\":\"encrypted\",\"target\":[\"production\"]}" \
              | jq '{key: .key, target: .target}'
          else
            echo "Creating new env var"
            curl -s -X POST \
              "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"key\":\"GROQ_API_KEY\",\"value\":\"$GROQ_API_KEY\",\"type\":\"encrypted\",\"target\":[\"production\"]}" \
              | jq '{key: .key, target: .target}'
          fi

      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel --prod --token "$VERCEL_TOKEN" --yes
